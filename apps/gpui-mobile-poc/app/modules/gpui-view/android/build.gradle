plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.gpuiview'
version = '0.1.0'

android {
  namespace "expo.modules.gpuiview"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // src/main/jniLibs/<abi>/libghostex_gpui_mobile.so is the output of
  // apps/gpui-mobile-poc/scripts/build-android.sh (gitignored).
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ViewCompat / WindowInsetsCompat for KeyboardResize (same version as the real app's modules).
  implementation "androidx.core:core-ktx:1.15.0"
}
