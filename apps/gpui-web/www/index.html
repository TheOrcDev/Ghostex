<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostex</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100vw; height: 100vh; overflow: hidden; background: #161616; color: #e5e5e5; font: 13px system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; }
      #loading.error { color: #ff7b72; white-space: pre-wrap; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="loading">Loading Ghostex…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
