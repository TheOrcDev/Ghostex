name: Managed client storage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  storage-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared web client
        run: git submodule update --init --depth 1 apps/web
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run storage:check
