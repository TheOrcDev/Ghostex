[package]
name = "ghostex-gpui-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
gpui.workspace = true
ghostex-gpui-mobile-chat = { path = "../chat" }
anyhow = "1"
futures = "0.3"
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
gpui-mobile = { path = "../../../.dependencies/gpui-mobile" }
android_logger = "0.15"
# Only for the `android_main` stub in src/android/mod.rs (same version and feature as gpui-mobile).
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
libc = "0.2"
ndk = { version = "0.9", features = ["nativewindow"] }

[target.'cfg(target_os = "ios")'.dependencies]
gpui-mobile = { path = "../../../.dependencies/gpui-mobile" }
