# CDXC:Mobile 2026-09-27 WHY: the phone links one Rust library: the UniFFI chat core the phone's TypeScript chat host uses (`packages/gx-chat-mobile`) and the GPUI transcript (`host`, with `chat`) in one binary. iOS cannot link two Rust static libraries (each carries its own copy of the standard library), and one Android library keeps one copy of everything the two share. `packages/gx-chat-mobile/build.sh --gpui` builds this crate in place of `gx-chat-mobile` alone; without `--gpui` (the release workflows today) the phone ships `libgx_chat_mobile` as before.
[package]
name = "ghostex-gx-mobile"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "gx_mobile"
path = "src/lib.rs"
# staticlib for the iOS XCFramework, cdylib for Android and for UniFFI's library-mode bindgen.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
ghostex-gx-chat-mobile = { path = "../../gx-chat-mobile" }
ghostex-gpui-mobile = { path = "../host" }
