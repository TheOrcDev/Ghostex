# The GPUI chat transcript inside a React Native app: proof of concept.
# `chat` compiles the desktop's own chat renderer and chat host (symlinked, like apps/gpui-web);
# `host` is the library the app loads (JNI on Android, a C ABI on iOS) on top of gpui-mobile.
[workspace]
resolver = "2"
members = ["chat", "host", "phone"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed" }

# Same redirects as apps/desktop and apps/gpui-web, so every crate builds the one gpui from the Zed fork.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../.dependencies/zed/crates/gpui" }
gpui_macros = { path = "../../.dependencies/zed/crates/gpui_macros" }
gpui_platform = { path = "../../.dependencies/zed/crates/gpui_platform" }
gpui_shared_string = { path = "../../.dependencies/zed/crates/gpui_shared_string" }
gpui_util = { path = "../../.dependencies/zed/crates/gpui_util" }
gpui_wgpu = { path = "../../.dependencies/zed/crates/gpui_wgpu" }
sum_tree = { path = "../../.dependencies/zed/crates/sum_tree" }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

# gpui's `shape_line` debug-asserts that its text has no newline, and the shared chat code passes it
# lines that can carry one (apps/gpui-web has the same setting and reason).
[profile.dev]
debug-assertions = false
panic = "unwind"

# An unoptimized text and layout engine is too slow to judge scrolling by, even in a dev build.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug-assertions = false
panic = "unwind"
# Symbol names stay so a panic's backtrace in logcat is readable; DWARF goes (Gradle's own strip
# step does not run on this library).
strip = "debuginfo"
