# CDXC:StateSync 2026-09-19 WHY:
# The gxserver wire contract exists on the server only as `json!` builders, with the TypeScript interfaces as the de facto schema. This crate is the typed client-side description of that contract for every Rust client (desktop now, mobile and web builds later). It carries serde and serde_json only, and stays on edition 2021, so the server crate (default stable toolchain) and apps/desktop (pinned toolchain) can both embed it, and so it builds for wasm32-unknown-unknown.
[package]
name = "ghostex-gx-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ghostex_gx_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
